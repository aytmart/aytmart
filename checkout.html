<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নিরাপদ চেকআউট | AYT Mart</title>
  <link rel="stylesheet" href="styles/themes/variables.css">
  <link rel="stylesheet" href="styles/base/reset.css">
  <link rel="stylesheet" href="styles/layout/layout.css">
  <style>
    .checkout-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: var(--space-8);
      margin-top: var(--space-6);
    }
    
    /* Form billing panel */
    .checkout-form-panel {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-lg);
      padding: var(--space-6);
    }
    .form-section-title {
      font-size: var(--font-base);
      font-weight: var(--weight-bold);
      margin-bottom: var(--space-5);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: var(--space-2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .form-field.full-width {
      grid-column: 1 / span 2;
    }
    .form-label {
      font-size: var(--font-sm);
      font-weight: var(--weight-medium);
      color: var(--text-color);
    }
    .form-input {
      background-color: var(--bg-surface-alt);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-sm);
      padding: var(--space-2) var(--space-3);
      font-size: var(--font-sm);
      transition: border-color var(--transition-fast);
      width: 100%;
    }
    .form-input:focus {
      border-color: var(--color-accent);
      background-color: var(--bg-surface);
    }

    /* Checkout summary card */
    .checkout-summary-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-lg);
      padding: var(--space-6);
      height: fit-content;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .items-scroller {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: var(--space-4);
    }
    .scroller-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--font-sm);
    }
    .scroller-item-name {
      font-weight: var(--weight-medium);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 200px;
    }
    
    .checkout-btn {
      width: 100%;
      background-color: var(--color-accent);
      color: #ffffff;
      padding: var(--space-3);
      border-radius: var(--border-radius-sm);
      font-weight: var(--weight-bold);
      text-align: center;
      font-size: var(--font-base);
      margin-top: var(--space-2);
      transition: background-color var(--transition-fast);
    }
    .checkout-btn:hover {
      background-color: var(--color-accent-hover);
    }
    
    .payment-badge {
      background-color: var(--bg-surface-alt);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-sm);
      padding: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      font-size: var(--font-sm);
    }

    @media (max-width: 768px) {
      .checkout-layout {
        grid-template-columns: 1fr;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-field.full-width {
        grid-column: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Header Injection Placeholder -->
  <header id="global-header"></header>

  <main class="main-container">
    <h1 class="section-title" style="text-align: left; margin-bottom: var(--space-4)">নিরাপদ চেকআউট</h1>

    <div class="checkout-layout">
      <!-- Shipping Address Form -->
      <form class="checkout-form-panel" id="checkout-form" onsubmit="processOrder(event)">
        <h2 class="form-section-title">শিপিং ও ডেলিভারি তথ্য (Delivery Details)</h2>
        
        <div class="form-grid">
          <!-- Full Name -->
          <div class="form-field full-width">
            <label class="form-label">গ্রাহকের নাম (Full Name) *</label>
            <input type="text" id="cust-name" class="form-input" placeholder="আপনার সম্পূর্ণ নাম লিখুন" required />
          </div>

          <!-- Phone Number -->
          <div class="form-field">
            <label class="form-label">মোবাইল নাম্বার (Mobile Number) *</label>
            <input type="tel" id="cust-phone" class="form-input" placeholder="01XXXXXXXXX" required />
          </div>

          <!-- Email -->
          <div class="form-field">
            <label class="form-label">ইমেইল এড্রেস (Email Address)</label>
            <input type="email" id="cust-email" class="form-input" placeholder="name@example.com" />
          </div>

          <!-- District -->
          <div class="form-field">
            <label class="form-label">জেলা (District) *</label>
            <select id="cust-district" class="form-input" onchange="adjustShippingCharge(this.value)" required>
              <option value="" disabled selected>জেলা নির্বাচন করুন</option>
              <option value="Dhaka">Dhaka (ঢাকা)</option>
              <option value="Chittagong">Chittagong (চট্টগ্রাম)</option>
              <option value="Sylhet">Sylhet (সিলেট)</option>
              <option value="Rajshahi">Rajshahi (রাজশাহী)</option>
              <option value="Khulna">Khulna (খুলনা)</option>
              <option value="Barisal">Barisal (বরিশাল)</option>
              <option value="Rangpur">Rangpur (রংপুর)</option>
              <option value="Mymensingh">Mymensingh (ময়মনসিংহ)</option>
            </select>
          </div>

          <!-- Area -->
          <div class="form-field">
            <label class="form-label">থানা / উপজেলা (Area/Upazila) *</label>
            <input type="text" id="cust-area" class="form-input" placeholder="থানা বা এলাকার নাম" required />
          </div>

          <!-- Address -->
          <div class="form-field full-width">
            <label class="form-label">পূর্ণ ঠিকানা (Full Address) *</label>
            <textarea id="cust-address" class="form-input" rows="3" placeholder="বাসা নং, রোড নং, এলাকার বিবরণ লিখুন" required></textarea>
          </div>
        </div>
      </form>

      <!-- Cart totals summary -->
      <div class="checkout-summary-card">
        <h2 class="form-section-title" style="margin-bottom: var(--space-2)">আপনার অর্ডার</h2>
        
        <!-- Cart Items Scroller -->
        <div class="items-scroller" id="checkout-items-scroller">
          <!-- Injected dynamically -->
        </div>

        <!-- Price summary -->
        <div class="summary-row" style="margin-top: var(--space-2);">
          <span>উপমোট (Subtotal):</span>
          <span id="subtotal-val" style="font-weight: var(--weight-semibold)">৳0.00</span>
        </div>
        <div class="summary-row">
          <span>ডেলিভারি চার্জ:</span>
          <span id="shipping-val">৳60.00</span>
        </div>
        <div class="grand-total-box">
          <span>মোট বিল (Grand Total):</span>
          <span id="grand-total-val">৳0.00</span>
        </div>

        <!-- Payment badge -->
        <div class="payment-badge">
          <span style="font-size: 1.25rem;">💵</span>
          <div>
            <strong>ক্যাশ অন ডেলিভারি (COD)</strong>
            <div style="font-size: var(--font-xs); color: var(--text-muted)">পণ্য হাতে পেয়ে মূল্য পরিশোধ করুন।</div>
          </div>
        </div>

        <button type="submit" form="checkout-form" class="checkout-btn">অর্ডার নিশ্চিত করুন ➔</button>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer Injection Placeholder -->
  <footer id="global-footer"></footer>

  <!-- App Services & Scripts -->
  <script src="config/environment/env.js"></script>
  <script src="utils/storage/storage.js"></script>
  <script src="api/shared/api-client.js"></script>
  <script src="components/header/header.js"></script>
  <script src="components/footer/footer.js"></script>
  <script src="components/whatsapp/whatsapp.js"></script>
  <script src="services/cart/cart-service.js"></script>
  
  <script>
    // Seed from the zone the customer already picked on the cart page (if any),
    // so the grand total shown here matches what they saw in the cart instead
    // of silently resetting to the ৳60 default. The district field below still
    // takes over — and is authoritative — the moment the customer picks one.
    let shippingCharge = StorageHelper.get('ayt_shipping_zone', 'inside') === 'outside' ? 120 : 60;

    document.addEventListener('DOMContentLoaded', () => {
      renderSummary();
    });

    function renderSummary() {
      const scroller = document.querySelector('#checkout-items-scroller');
      const cart = CartService.getCart();
      const summary = CartService.getSummary();

      if (summary.itemCount === 0) {
        alert('আপনার শপিং কার্ট খালি!');
        window.location.href = 'products.html';
        return;
      }

      scroller.innerHTML = cart.items.map(item => `
        <div class="scroller-item">
          <span class="scroller-item-name">${item.Product_Name} x ${item.Quantity}</span>
          <span>৳${(parseFloat(item.Price) * item.Quantity).toFixed(2)}</span>
        </div>
      `).join('');

      document.querySelector('#subtotal-val').innerText = `৳${summary.subtotal.toFixed(2)}`;
      document.querySelector('#shipping-val').innerText = `৳${shippingCharge.toFixed(2)}`;
      document.querySelector('#grand-total-val').innerText = `৳${(summary.subtotal + shippingCharge).toFixed(2)}`;
    }

    function adjustShippingCharge(district) {
      const isInsideDhaka = district.toLowerCase() === 'dhaka';
      shippingCharge = isInsideDhaka ? 60 : 120; // ৳60 Inside Dhaka / ৳120 Outside Dhaka [1]
      StorageHelper.set('ayt_shipping_zone', isInsideDhaka ? 'inside' : 'outside');

      document.querySelector('#shipping-val').innerText = `৳${shippingCharge.toFixed(2)}`;

      const summary = CartService.getSummary();
      document.querySelector('#grand-total-val').innerText = `৳${(summary.subtotal + shippingCharge).toFixed(2)}`;
    }

    async function processOrder(event) {
      event.preventDefault();

      const phoneInput = document.querySelector('#cust-phone').value.trim();
      
      // Strict Bangladesh Phone number structure check matching ERP_Rules §6 [1]
      const bdPhoneRegex = /^(?:\+?880|0)1[3-9]\d{8}$/;
      if (!bdPhoneRegex.test(phoneInput)) {
        alert('অনুগ্রহ করে একটি সঠিক বাংলাদেশী মোবাইল নাম্বার প্রদান করুন (যেমন: 017XXXXXXXX)।');
        return;
      }

      const cart = CartService.getCart();
      const summary = CartService.getSummary();

      const orderData = {
        name: document.querySelector('#cust-name').value.trim(),
        phone: phoneInput,
        email: document.querySelector('#cust-email').value.trim(),
        district: document.querySelector('#cust-district').value,
        area: document.querySelector('#cust-area').value.trim(),
        address: document.querySelector('#cust-address').value.trim(),
        items: cart.items,
        subtotal: summary.subtotal,
        shipping: shippingCharge,
        grandTotal: summary.subtotal + shippingCharge
      };

      try {
        // Try submitting through Apps Script endpoint
        const response = await ApiClient.request('orders.create', orderData);
        if (response && response.success) {
          CartService.clearCart();
          StorageHelper.set('ayt_last_order', { ...response.data, Order_Status: 'confirmed', synced: true });
          window.location.href = 'order-success.html';
          return;
        }
      } catch (err) {
        console.warn('Backend API connection timed out. Order will be saved locally and flagged as unconfirmed.', err);
      }

      // Offline fallback: the order is saved locally so the customer isn't
      // stuck, but it is explicitly flagged as NOT yet reaching the store's
      // backend — order-success.html shows a different message for this case
      // instead of a fabricated "confirmed" state, since the merchant hasn't
      // actually received this order yet.
      const orderId = generateLocalOrderId();
      const localOrderRecord = {
        Order_ID: orderId,
        Customer_Name: orderData.name,
        Customer_Phone: orderData.phone,
        Grand_Total: orderData.grandTotal,
        Shipping_Address: `${orderData.address}, ${orderData.area}, ${orderData.district}`,
        Created_At: new Date().toISOString(),
        Order_Status: 'pending_sync'
      };

      CartService.clearCart();
      StorageHelper.set('ayt_last_order', localOrderRecord);
      window.location.href = 'order-success.html';
    }

    /**
     * Generates order key following pattern specified in database.md §4.2 [1]
     */
    function generateLocalOrderId() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const randomPart = Math.floor(1000 + Math.random() * 9000);
      return `AYT-${yyyy}${mm}${dd}-${randomPart}`;
    }
  </script>
</body>
</html>
